<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tobi Christoph — Photography</title>
    <meta name="description" content="Photography by Tobi Christoph: outdoors, events, travel, street and people." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/room.css" />
  </head>
  <body>
    <div id="stage"><div id="ring"></div></div>

    <div id="sub">
      <div id="sub-head">
        <div class="k" id="sub-k"></div>
        <h2 id="sub-title"></h2>
      </div>
      <div id="clouds"></div>
    </div>

    <div id="sheet">
      <div id="sheet-head">
        <div class="k" id="sheet-k"></div>
        <h2 id="sheet-title"></h2>
      </div>
      <div id="sheet-body"></div>
    </div>

    <header id="hdr">
      <button id="back"></button>
    </header>
    <button class="nav" id="prev"><span class="c">←</span><span id="prev-name"></span></button>
    <button class="nav" id="next"><span class="c">→</span><span id="next-name"></span></button>
    <div id="dots"></div>
    <div id="contact">
      <h2>Contact</h2>
      <a class="field" href="mailto:tobiashchristoph@outlook.com">
        <span>tobiashchristoph@outlook.com</span>
        <span class="write" aria-hidden="true">Write ↗</span>
      </a>
      <a class="ig" href="https://www.instagram.com/tobichristoph" target="_blank" rel="noopener">Instagram ↗</a>
    </div>
    <div id="zoom"><img alt="" /></div>
    <div id="veil"></div>
    <div id="grain"></div>

    <script src="/data.js"></script>
    <script src="/assets/room.js"></script>
  </body>
</html>
